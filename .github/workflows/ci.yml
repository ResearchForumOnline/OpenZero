name: OpenZero public checks

on:
  push:
  pull_request:

jobs:
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile public Python files
        run: |
          cd openzero
          python -m compileall brain hivemind openzero_doctor.py openzero_watchdog.py zero_core.py
      - name: Verify public model catalog
        run: python -m unittest openzero.tests.test_model_catalog_contract
      - name: Install bounded test dependencies
        run: python -m pip install 'Flask>=3.0,<4' 'requests>=2.31,<3' 'cryptography>=42'
      - name: Run runtime, peer and distribution regressions
        working-directory: openzero
        run: python -m unittest discover -s tests
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and test Tab Pilot
        working-directory: browser-extension
        run: npm run check
      - name: Check peer UI syntax
        run: node --check openzero/static/peer-mesh.js
      - name: Build reviewed distribution artifacts
        run: python scripts/build_release.py
